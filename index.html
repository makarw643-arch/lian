/* ===== Login gate ===== */
body.login-on{overflow:hidden}

.login{
  --ring:rgba(110,130,165,.42);--secc:rgba(80,95,120,.8);
  --sg0:rgba(100,115,140,.10);--sg1:rgba(205,168,92,.5);--quote:rgba(60,75,100,.08);
  position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:18px 14px;overflow:hidden;
  background:
    radial-gradient(ellipse 90% 70% at 50% 0%,rgba(255,255,255,.98) 0%,transparent 50%),
    radial-gradient(ellipse 70% 50% at 80% 30%,rgba(210,222,240,.45) 0%,transparent 55%),
    radial-gradient(ellipse 80% 60% at 15% 85%,rgba(180,195,220,.35) 0%,transparent 50%),
    linear-gradient(160deg,#f6f8fc 0%,#e4ebf4 40%,#d0dbe8 75%,#c2cedd 100%);
  transition:background 1.2s ease;
  -webkit-user-select:none;user-select:none;
}
.login input{-webkit-user-select:text;user-select:text}
.login.night{
  --ring:rgba(200,215,240,.34);--secc:rgba(200,212,235,.8);
  --sg0:rgba(200,210,230,.10);--sg1:rgba(228,192,112,.55);--quote:rgba(200,210,230,.08);
  background:
    radial-gradient(ellipse 80% 60% at 50% 10%,rgba(40,50,70,.5) 0%,transparent 55%),
    radial-gradient(ellipse 60% 50% at 75% 70%,rgba(30,40,60,.4) 0%,transparent 50%),
    linear-gradient(165deg,#1a2030 0%,#121820 50%,#0c1018 100%)!important;
}




.login.night .login-glass input::placeholder{color:#6a7588}

/* background layers (blurred as one unit for depth of field) */




@keyframes dustFloat{from{transform:translate(0,0)}to{transform:translate(var(--dx,12px),var(--dy,-20px))}}



@keyframes blobFloat{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(var(--tx,20px),var(--ty,-18px),0) scale(1.05)}}
.login::before{
  content:"";position:absolute;inset:-20%;pointer-events:none;opacity:.35;
  background-image:radial-gradient(circle,rgba(255,255,255,.6) 0 1px,transparent 1.5px);
  background-size:50px 50px;animation:loginDrift 70s linear infinite;
}
@keyframes loginDrift{to{transform:translate3d(-20px,-40px,0)}}

@keyframes fall3d{
  0%{transform:translate3d(0,-15vh,60px);opacity:0}
  10%{opacity:.38}60%{opacity:.28}
  100%{transform:translate3d(var(--x,10px),110vh,-40px);opacity:0}
}
/* (1) Apple-style intro: black → light opens from the centre */


@keyframes bloom{
  0%{opacity:0;transform:scale(.2)}
  22%{opacity:1;transform:scale(1)}
  70%{opacity:1;transform:scale(12)}
  100%{opacity:0;transform:scale(26)}
}
/* (7)(13) footer: gold-at-an-angle signature + quote of the day */



/* (6) liquid-glass name capsule with a slow internal highlight */

.login-glass::before{
  content:"";position:absolute;left:10%;right:10%;top:6%;height:38%;border-radius:999px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));
  animation:glassBreath 6.5s ease-in-out infinite alternate;
}
.login-glass::after{
  content:"";position:absolute;top:0;bottom:0;left:-10%;width:60%;pointer-events:none;z-index:2;
  background:linear-gradient(105deg,transparent 0%,var(--sheen) 50%,transparent 100%);
  filter:blur(5px);opacity:.7;
  animation:glassSheen 8s ease-in-out infinite alternate;
}
@keyframes glassBreath{from{transform:translateX(-7%);opacity:.75}to{transform:translateX(7%);opacity:1}}
@keyframes glassSheen{from{transform:translateX(-30%) skewX(-12deg)}to{transform:translateX(190%) skewX(-12deg)}}


.login-glass input::placeholder{color:#b0b8c8;font-size:11px;font-weight:300;letter-spacing:.4px}

/* (12) returning-user greeting capsule */






.login button:focus,.login input:focus{outline:none!important}

@keyframes loginRise{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
/* dark stylized clock */


.braun-wrap::before{
  content:"";position:absolute;inset:-28%;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.7),rgba(200,215,240,.25) 40%,transparent 68%);
  filter:blur(12px);animation:haloPulse 5.5s ease-in-out infinite alternate;
}
@keyframes haloPulse{from{opacity:.45;transform:scale(.94)}to{opacity:.9;transform:scale(1.06)}}
/* (3) sound-wave ring */

/* (8) 3D tilt wrapper */

/* (5) floating second counter */




@keyframes orbitSpin{to{transform:rotate(calc(var(--a) + 360deg)) translateY(-108px)}}

.braun::after{
  content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:3;
  background:linear-gradient(125deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.05) 28%,transparent 48%);
}
/* (14) finger-follow glass reflection */



@keyframes handsIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
/* (16) particle canvas */

/* (15) gallery mode */


.login.gallery{--ring:rgba(255,255,255,.26);--secc:rgba(230,236,248,.75)}


.login.gallery .braun-wrap::before{opacity:.25}
/* (11) leaving: scene collapses into the clock, then app opens */
@keyframes appOpen{from{opacity:0;transform:scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}


.login.rm *{animation-delay:0s!important}

  border:1.5px solid #fff;
  background:linear-gradient(110deg,rgba(255,255,255,.82),rgba(224,228,231,.4),rgba(255,255,255,.82));

/* arrow glued to capsule bottom */






/* ===== mask-image notch: face layer carved at bottom, arrow fused in ===== */
#lpCap .cap-sh{overflow:visible;position:relative;z-index:2}
#lpCap .cap-face{
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:
    linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 40%,rgba(255,255,255,.2));
  border:1px solid rgba(255,255,255,.65);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.9);
  /* mask: full body minus elliptical bite at bottom center */
  -webkit-mask-image:
    linear-gradient(#000,#000),
    radial-gradient(ellipse 30px 18px at 50% 100%, #000 0 100%, transparent 100%);
  -webkit-mask-size:100% 100%, 60px 36px;
  -webkit-mask-position:0 0, 50% 100%;
  -webkit-mask-repeat:no-repeat;
  -webkit-mask-composite: destination-out;
  mask-image:
    linear-gradient(#000,#000),
    radial-gradient(ellipse 30px 18px at 50% 100%, #000 0 100%, transparent 100%);
  mask-size:100% 100%, 60px 36px;
  mask-position:0 0, 50% 100%;
  mask-repeat:no-repeat;
  mask-composite: exclude;
}
#lpCap .cap-rec-w,
#lpCap .cap-msg-w,
#lpCap .cap-clk{position:relative;z-index:1}
#lpCap .cap-go{
  position:absolute;z-index:8;left:50%;bottom:-2px;transform:translate(-50%,40%);
  width:52px;height:30px;padding:0;border:0;cursor:pointer;
  appearance:none;-webkit-appearance:none;background:transparent;
  display:grid;place-items:center;
}
#lpCap .cap-go:focus-visible{outline:2px solid #888;outline-offset:3px;border-radius:14px}
#lpCap .cap-notch{
  position:relative;width:48px;height:26px;
  background:
    radial-gradient(ellipse 90% 70% at 50% 12%,rgba(255,255,255,.98),rgba(255,255,255,.18) 55%,transparent 72%),
    linear-gradient(180deg,rgba(252,253,255,.95) 0%,rgba(220,226,232,.82) 52%,rgba(175,183,192,.72) 100%);
  border:1.6px solid rgba(255,255,255,.98);
  border-top:1px solid rgba(255,255,255,.35);
  border-radius:8px 8px 24px 24px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.98),
    inset 0 -2px 5px rgba(255,255,255,.7),
    0 2px 4px rgba(40,48,56,.08),
    0 6px 14px rgba(40,48,56,.1);
  /* soft mask so lobe blends into rim */
  -webkit-mask-image: radial-gradient(ellipse 95% 100% at 50% 0%, #000 0 70%, transparent 100%);
  mask-image: radial-gradient(ellipse 95% 100% at 50% 0%, #000 0 70%, transparent 100%);
}
#lpCap .cap-notch:before{
  content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
  width:60px;height:14px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.45),transparent 70%);
  pointer-events:none;z-index:-1;
}
#lpCap .cap-notch:after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-35%);
  width:0;height:0;
  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-top:9px solid rgba(255,255,255,.96);
  filter:drop-shadow(0 1.5px 1px rgba(70,78,88,.35));
}
#lpCap .cap-go:hover .cap-notch{filter:brightness(1.05)}
#lpCap .cap-go:active .cap-notch{transform:translateY(1px) scale(.96)}
@media(max-width:480px){
  #lpCap .cap-go{width:44px;height:26px;bottom:-1px;transform:translate(-50%,38%)}
  #lpCap .cap-notch{width:40px;height:22px;border-radius:6px 6px 20px 20px}
  #lpCap .cap-notch:after{border-left-width:6px;border-right-width:6px;border-top-width:7px}
  #lpCap .cap-face{
    -webkit-mask-size:100% 100%, 50px 30px;

  }
}


/* ===== Capsula: capsule + arrow tab drawn as ONE shape (JS adds .shaped) ===== */
#lpCap .cap-bd,#lpCap .cap-shape{position:absolute;left:-2px;top:-2px;pointer-events:none;display:none}

#lpCap .cap-notch:before,#lpCap .cap-notch:after{display:none}
#lpCap .cap-go:hover .cap-notch{filter:drop-shadow(0 1px 0 rgba(255,255,255,.95)) brightness(1.2)}
#lpCap .cap-go:active .cap-notch{transform:translateY(1px) scale(.94)}
@media(max-width:480px){

/* ===== Turntable full-screen layer ===== */
#lpTT{position:fixed;inset:0;z-index:5000;visibility:hidden;pointer-events:none;overflow:hidden;background:#e8e8e8;overscroll-behavior:none;direction:ltr;color:#111;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}

<script>
var LPAES=null,LPBASE=null,LPCACHE=Object.create(null);
(function(){
  const P=Storage.prototype,_set=P.setItem,_get=P.getItem,_rm=P.removeItem;
  const isU=k=>typeof k==='string'&&k.indexOf('lianplanner:')===0;
  window.lpRawGet=k=>_get.call(localStorage,k);
  window.lpRawSet=(k,v)=>_set.call(localStorage,k,v);
  P.setItem=function(k,v){if(this!==localStorage||!isU(k))return _set.call(this,k,v);if(!LPAES)return;LPCACHE[k]=String(v);lpQueue(k)};
  P.getItem=function(k){if(this!==localStorage||!isU(k)||!LPAES)return _get.call(this,k);return Object.prototype.hasOwnProperty.call(LPCACHE,k)?LPCACHE[k]:null};
  P.removeItem=function(k){if(this!==localStorage||!isU(k))return _rm.call(this,k);if(!LPAES)return;delete LPCACHE[k];_rm.call(this,k)};
})();

let KEY=lpBootKey(),JM='فروردین اردیبهشت خرداد تیر مرداد شهریور مهر آبان آذر دی بهمن اسفند'.split(' '),
WD='شنبه یکشنبه دوشنبه سه‌شنبه چهارشنبه پنجشنبه جمعه'.split(' '),
MOODS=[['😄','خیلی خوشحال',0],['🙂','خوشحال',0],['😐','عادی',0],['😴','خسته',0],['😢','غمگین',1],['😰','مضطرب',1],['😠','ناراحت',1]],
ICONS=['🌸','💧','📖','🏃‍♀️','🧘‍♀️','🍎','😴','✍️','🎧','💊'],PRE=[7,14,30,90,180,365];
let S=load(),route=location.hash.slice(1)||'dash',calV={};
const div=(a,b)=>~~(a/b),fa=n=>(typeof S!='undefined'&&(S.lang=='en'||S.theme=='pixel'))?String(n):Number(n).toLocaleString('fa-IR',{useGrouping:false}),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function g2j(gy,gm,gd){const t=[0,31,59,90,120,151,181,212,243,273,304,334],g2=gm>2?gy+1:gy;let d=355666+365*gy+div(g2+3,4)-div(g2+99,100)+div(g2+399,400)+gd+t[gm-1],jy=-1595+33*div(d,12053);d%=12053;jy+=4*div(d,1461);d%=1461;if(d>365){jy+=div(d-1,365);d=(d-1)%365}return d<186?[jy,1+div(d,31),1+d%31]:[jy,7+div(d-186,30),1+(d-186)%30]}
function j2g(jy,jm,jd){jy+=1595;let d=-355668+365*jy+div(jy,33)*8+div(jy%33+3,4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*div(d,146097);d%=146097;if(d>36524){gy+=100*div(--d,36524);d%=36524;if(d>=365)d++}gy+=4*div(d,1461);d%=1461;if(d>365){gy+=div(d-1,365);d=(d-1)%365}let gd=d+1;const s=[0,31,(gy%4==0&&gy%100!=0||gy%400==0)?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;for(;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]}
const toD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c,12)},iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
today=()=>iso(new Date()),addD=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return iso(d)},diff=(a,b)=>Math.round((toD(b)-toD(a))/864e5),wd=s=>(toD(s).getDay()+1)%7;
const jmLen=(y,m)=>m<=6?31:m<=11?30:(g2j(...j2g(y,12,30))[1]==12?30:29);
function fmt(s){const d=toD(s);if(S.cal=='j'){const[y,m,dd]=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());return fa(dd)+' '+JM[m-1]+' '+fa(y)}return d.toLocaleDateString((S.lang=='en'?'en-US-u-ca-gregory':'fa-IR-u-ca-gregory'),{day:'numeric',month:'long',year:'numeric'})}
const sched=(h,s)=>s>=h.start&&(!h.end||s<=h.end)&&(s<=today()||(S.done[s]&&S.done[s][h.id])),isDone=(h,s)=>!!(S.done[s]&&S.done[s][h.id]);
function streak(h){let s=today(),n=0,c=0;for(let i=0;i<4000&&s>=h.start;i++,s=addD(s,-1)){if(!sched(h,s))continue;if(isDone(h,s))n++;else if(s!=today())break}return n}
function pct(h,days=30){let t=0,d=0,s=today();for(let i=0;i<days;i++,s=addD(s,-1)){if(sched(h,s)){t++;if(isDone(h,s))d++}}return t?Math.round(d/t*100):0}
const goalPct=g=>g.status=='done'?100:g.progress||0,bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toggle(id,s){S.done[s]=S.done[s]||{};if(S.done[s][id])delete S.done[s][id];else S.done[s][id]=1;save();render()}
function mood(){const t=today(),m=S.moods[t]||{};const last=Object.keys(S.moods).sort().reverse().slice(0,14);
return`<h1>حال‌وهوای امروز</h1><div class="mu">${fmt(t)}${S.moods[t]?' · می‌توانید ثبت امروز را ویرایش کنید':''}</div>
<div class="card"><div class="moods">${MOODS.map((x,i)=>`<button class="${m.m===i?'on':''}" onclick="pickMood(${i})"><b>${x[0]}</b>${x[1]}</button>`).join('')}</div>
<label id="mlab">${m.m!=null&&MOODS[m.m][2]?'اگر دوست داری بنویس چه اتفاقی افتاد؛ کاملاً اختیاری است 🤍':'یادداشت (اختیاری)'}</label><textarea id="mnote" rows="4">${esc(m.note)}</textarea>
<button class="p" style="margin-top:10px" onclick="saveMood()">ذخیره</button></div>
<div class="card"><h2>سابقه</h2>${last.length?last.map(d=>`<div class="hab"><span style="font-size:26px">${MOODS[S.moods[d].m][0]}</span><div style="flex:1"><b>${fmt(d)}</b><div class="mu">${esc(S.moods[d].note)}</div></div><button onclick="editMood('${d}')">ویرایش</button></div>`).join(''):'<div class="mu">هنوز سابقه‌ای نیست.</div>'}</div>`}
let tmpMood=null,moodDate=null;
function pickMood(i){tmpMood=i;document.querySelectorAll('.moods button').forEach((b,j)=>b.classList.toggle('on',i==j));document.getElementById('mlab').textContent=MOODS[i][2]?'اگر دوست داری بنویس چه اتفاقی افتاد؛ کاملاً اختیاری است 🤍':'یادداشت (اختیاری)'}
function saveMood(){const d=moodDate||today(),i=tmpMood!=null?tmpMood:(S.moods[d]||{}).m;if(i==null)return alert('ابتدا یک حال‌وهوا انتخاب کنید.');S.moods[d]={m:i,note:document.getElementById('mnote').value.trim()};tmpMood=null;moodDate=null;save();render()}
function editMood(d){const e=S.moods[d];dlg(`<h2>ویرایش ${fmt(d)}</h2><div class="moods">${MOODS.map((x,i)=>`<button id="em${i}" class="${e.m===i?'on':''}" onclick="document.querySelectorAll('[id^=em]').forEach(b=>b.classList.remove('on'));this.classList.add('on');window._em=${i}"><b>${x[0]}</b>${x[1]}</button>`).join('')}</div><label>یادداشت</label><textarea id="en" rows="3">${esc(e.note)}</textarea>${btns(`S.moods['${d}']={m:window._em!=null?window._em:${e.m},note:document.getElementById('en').value.trim()};window._em=null;`,`delete S.moods['${d}'];`)}`)}
function habits(){return`<h1>عادت‌ها</h1>${lpSleepCard()}<button class="p" onclick="habForm()">+ عادت جدید</button>${S.habits.length?S.habits.map(h=>`<div class="card"><div class="row sp"><b style="font-size:18px">${h.icon} ${esc(h.title)}</b>${h.paused?'<span class="tag">متوقف</span>':''}</div><div class="mu">${esc(h.desc)}</div><div class="mu">${h.days.map(d=>WD[d]).join('، ')} · از ${fmt(h.start)}${h.end?' تا '+fmt(h.end):''}</div><div class="mu">🔥 ${fa(streak(h))} روز پیاپی · ${fa(pct(h))}٪ در ۳۰ روز اخیر</div>${bar(pct(h))}<div class="row" style="margin-top:10px"><button onclick="habForm('${h.id}')">ویرایش</button><button onclick="pauseH('${h.id}')">${h.paused?'ادامه':'توقف'}</button><button class="d" onclick="delH('${h.id}')">حذف</button></div></div>`).join(''):'<div class="card mu">هنوز عادتی نساخته‌اید.</div>'}`}
function pauseH(id){const h=S.habits.find(x=>x.id==id);h.paused=!h.paused;save();render()}
function goals(){return`<h1>اهداف</h1><button class="p" onclick="goalForm()">+ هدف جدید</button>${S.goals.length?S.goals.map(g=>`<div class="card"><div class="row sp"><b style="font-size:18px">${esc(g.title)}</b><span class="tag">${{active:'فعال',paused:'متوقف',done:'انجام‌شده'}[g.status]}</span></div><div class="mu">${esc(g.desc)}</div><div class="mu">${fmt(g.start)} ← ${fmt(g.end)} · ${g.status=='done'?'تکمیل شد':diff(today(),g.end)>=0?fa(diff(today(),g.end))+' روز مانده':'مهلت گذشته'}</div>${bar(goalPct(g))}<div class="row sp mu"><span>${fa(goalPct(g))}٪</span></div><input type="range" min="0" max="100" value="${goalPct(g)}" ${g.status=='done'?'disabled':''} onchange="setGP('${g.id}',+this.value)"><div class="row" style="margin-top:10px"><button onclick="goalForm('${g.id}')">ویرایش</button><button onclick="setGS('${g.id}','${g.status=='paused'?'active':'paused'}')">${g.status=='paused'?'ادامه':'توقف'}</button><button onclick="setGS('${g.id}','${g.status=='done'?'active':'done'}')">${g.status=='done'?'بازگشایی':'تکمیل شد'}</button><button class="d" onclick="delG('${g.id}')">حذف</button></div></div>`).join(''):'<div class="card mu">هنوز هدفی نساخته‌اید.</div>'}`}
function setGP(id,p){S.goals.find(g=>g.id==id).progress=p;save();render()}
function setGS(id,s){S.goals.find(g=>g.id==id).status=s;save();render()}
function delG(id){if(confirm('این هدف حذف شود؟')){S.goals=S.goals.filter(g=>g.id!=id);save();render()}}
function goalForm(id){const g=S.goals.find(x=>x.id==id)||{title:'',desc:'',start:today(),end:addD(today(),30)},n=diff(g.start,g.end);
dlg(`<h2>${id?'ویرایش':'هدف جدید'} </h2><label>عنوان</label><input id="gt" value="${esc(g.title)}"><label>توضیح</label><input id="gd" value="${esc(g.desc)}"><label>تاریخ شروع</label><input type="date" id="gs" value="${g.start}"><label>مدت</label><select id="gp" onchange="if(this.value)document.getElementById('gn').value=this.value">${PRE.map(p=>`<option value="${p}" ${p==n?'selected':''}>${fa(p)} روز</option>`).join('')}<option value="">سفارشی</option></select><label>تعداد روز</label><input type="number" min="1" id="gn" value="${n}">${btns(`const s=v('gs'),n=+v('gn');if(!v('gt'))return'عنوان را بنویسید.';if(!s||!(n>0))return'تاریخ و مدت را درست وارد کنید.';const o={title:v('gt'),desc:v('gd'),start:s,end:addD(s,n)};${id?`Object.assign(S.goals.find(x=>x.id=='${id}'),o)`:`S.goals.push(Object.assign(o,{id:uid(),status:'active',progress:0}))`};`)}`)}
function calNav(d){calV.m+=d;if(calV.m>12){calV.m=1;calV.y++}if(calV.m<1){calV.m=12;calV.y--}render()}
const v=id=>document.getElementById(id).value.trim();

function ym(){if(!tk||tk.c!=S.cal)tk=Object.assign(curYM(),{c:S.cal});return tk}
const mk=(y,m,d)=>S.cal=='j'?iso(new Date(...(([a,b,c])=>[a,b-1,c])(j2g(y,m,d)),12)):iso(new Date(y,m-1,d,12));

const mName=(y,m)=>S.cal=='j'?JM[m-1]:new Date(y,m-1,1).toLocaleDateString((S.lang=='en'?'en-US-u-ca-gregory':'fa-IR-u-ca-gregory'),{month:'long'});
function rangeStat(a,n){let d=0,t=0;for(let i=0;i<n;i++){const[x,y]=dayStat(addD(a,i));d+=x;t+=y}return t?Math.round(d/t*100):null}
const pf=p=>p==null?'—':fa(p)+(S.lang=='en'||S.theme=='pixel'?'%':'٪');
/* ===== MOOD RADAR (home): the uploaded chart, shown exactly as designed, fed by the planner's own mood records ===== */

const J3_COLORS=["#b48e96","#f2eee8","#dccab3","#b9c5b8","#4b2e28","#7c7c4c"];
const J3_QUOTES=["fit, confident & classy.","softly, on purpose.","foundation before the view.","steady is the point.","nothing left to prove.","quietly, then all at once."];

function j3Ink(hex){const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;return(r*.299+g*.587+b*.114)<120?"#f4ede6":"#2f2623"}
const J3_DEFAULT="";
function j3Data(){
  if(S.journals&&S.journals.length===3&&S.journals[0].name==='Blue Journal'&&S.journals.every(b=>(b.pages||[]).every(p=>!p)))S.journals=null;
  if(S.journals&&S.journals.length){
    // one-time clean of old filler seed text
    if(!S._j3clean){
      const junk=/Dear Diary|Little Things|Golden Memories|My Dreams|My Story|Another Page|صفحه‌ی تازه|اینجا بنویس|امروز یک روز تازه|چیزهای کوچکی|خاطرات من|رویاهای من|داستان من|ادامه‌ی داستان/;
      S.journals.forEach(b=>{(b.pages||[]).forEach((p,i)=>{if(typeof p==='string'&&junk.test(p))b.pages[i]=''})});
      S._j3clean=1;save();
    }
    return S.journals;
  }
  const seed=J3_QUOTES.map((q,i)=>({name:q,quote:q,color:J3_COLORS[i],pages:Array(10).fill('')}));
  S.journals=seed;save();return seed;
}

function j3SetupShelf(){
  const shelf=document.getElementById('j3Shelf');if(!shelf)return;
  const items=[...document.querySelectorAll('.j3-book')];
  let lastActive=null;
  function update(){
    const center=shelf.getBoundingClientRect().left+shelf.clientWidth/2;
    let closest=null,minD=Infinity;
    items.forEach(el=>{
      const rect=el.getBoundingClientRect();
      const d=Math.abs(rect.left+rect.width/2-center);
      if(d<minD){minD=d;closest=el}
      const ratio=Math.min(d/(shelf.clientWidth*.48),1);
      const scale=1.2-ratio*.48,depth=110-ratio*230,opacity=1-ratio*.5,rotate=ratio*20;
      el.style.transform=`translateZ(${depth}px) scale(${scale}) rotateY(${rotate}deg)`;
      el.style.opacity=String(opacity);
      el.style.filter=`saturate(${1.15-ratio*.45})`;
      el.classList.remove('active');
    });
    if(closest){
      closest.classList.add('active');
      closest.style.transform='translateZ(110px) scale(1.2) rotateY(0)';
      closest.style.opacity='1';
      closest.style.filter='saturate(1.15)';
      if(lastActive!==closest){
        closest.classList.remove('j3-pop');
        void closest.offsetWidth;
        closest.classList.add('j3-pop');
        lastActive=closest;
        const idx=+closest.dataset.index;
        if(!isNaN(idx))j3Sel=idx;
      }
    }
  }
  // faster wheel scroll on shelf
  shelf.onwheel=e=>{
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){
      e.preventDefault();
      shelf.scrollLeft+=(e.deltaY+e.deltaX)*1.85;
    }
  };
  shelf.onscroll=()=>{if(j3ScrollF)cancelAnimationFrame(j3ScrollF);j3ScrollF=requestAnimationFrame(update)};
  update();
  if(items[j3Sel]||items[0]){
    requestAnimationFrame(()=>{(items[j3Sel]||items[0]).scrollIntoView({behavior:'instant',block:'nearest',inline:'center'});update()});
  }
}

function j3Turn(dir){
  if(j3Busy||!j3Open)return;
  j3SaveVisible();
  let next=j3Page+dir*2;
  if(next<0)return;
  if(dir>0){while(j3Cur().pages.length<=next+1)j3Cur().pages.push(J3_DEFAULT)}
  else if(next+1>=j3Cur().pages.length)return;
  j3Busy=true;
  const spread=document.getElementById('j3Spread');
  const sheet=document.createElement('div');
  sheet.className='j3-flip '+(dir>0?'next':'prev');
  if(spread)spread.appendChild(sheet);
  setTimeout(()=>{j3Page=next;j3RenderPages();if(sheet.parentNode)sheet.remove();j3Busy=false;S.journals=j3Data();save()},850);
}
function j3AddPage(){
  if(j3Busy||!j3Open)return;
  j3SaveVisible();
  j3Cur().pages.splice(j3Page+2,0,J3_DEFAULT);
  if(j3Cur().pages.length%2)j3Cur().pages.push('');
  S.journals=j3Data();save();j3RenderPages();toast('+ صفحه');
}
function j3DelPage(side){
  if(j3Busy||!j3Open)return;
  j3SaveVisible();
  const el=document.getElementById(side===0?'j3L':'j3R');
  const index=j3Page+side;
  if(!j3Cur().pages[index]||!el)return;
  j3Busy=true;
  const paper=document.createElement('div');paper.className='j3-crumple';el.appendChild(paper);
  setTimeout(()=>{
    j3Cur().pages.splice(index,1);
    if(!j3Cur().pages.length)j3Cur().pages=[J3_DEFAULT,J3_DEFAULT];
    if(j3Cur().pages.length%2)j3Cur().pages.push('');
    j3Page=Math.min(j3Page,Math.max(0,Math.floor((j3Cur().pages.length-1)/2)*2));
    j3RenderPages();S.journals=j3Data();save();j3Busy=false;
  },1150);
}

  books.push({name:name.trim(),color:J3_COLORS[books.length%J3_COLORS.length],pages});
  j3Sel=books.length-1;S.journals=books;save();

function lpSound(kind){
  if(kind==='boom')lpWavePluck(.5,26);else if(kind==='tap')lpWavePluck(.15+Math.random()*.7,8);
  if(!lpSndOn)return;
  try{
    lpAC=lpAC||new (window.AudioContext||window.webkitAudioContext)();
    if(lpAC.state==='suspended')lpAC.resume();
    const t=lpAC.currentTime,o=lpAC.createOscillator(),g=lpAC.createGain();

    o.type=kind==='boom'?'triangle':'sine';o.frequency.value=c[0];
    g.gain.setValueAtTime(c[1],t);g.gain.exponentialRampToValueAtTime(.0001,t+c[2]);
    o.connect(g);g.connect(lpAC.destination);o.start(t);o.stop(t+c[2]+.05);
  }catch(e){}

function lpWaveLoop(now){

  stretch+=(clamp(Math.abs(pv)*.02,0,.12)-stretch)*(1-Math.exp(-dt*16));
  const settled=!dragging&&Math.abs(target-pos)<.002&&Math.abs(ot-o)<.003&&stretch<.003;
  if(settled){pos=target;o=ot;stretch=0;}
  render();
  if(settled){running=false;}else requestAnimationFrame(frame);
}

/* depth slider */
function setDepth(e){const r=line.getBoundingClientRect();depths[sel]=clamp((e.clientX-r.left)/r.width,0,1);paint(sel);depthUI();}
depthEl.addEventListener('pointerdown',e=>{e.stopPropagation();depthEl.setPointerCapture(e.pointerId);depthEl.classList.add('act');setDepth(e);});
depthEl.addEventListener('pointermove',e=>{if(depthEl.classList.contains('act'))setDepth(e);});
const endD=()=>depthEl.classList.remove('act');
depthEl.addEventListener('pointerup',endD);depthEl.addEventListener('pointercancel',endD);

/* stepper */
$('step').addEventListener('pointerdown',e=>e.stopPropagation());
$('up').addEventListener('click',()=>setT(Math.round(target)-1));
$('dn').addEventListener('click',()=>setT(Math.round(target)+1));

/* roller toggle + strip scrolling */
let moved=0,ly=0,lt=0,sy=0,downEl=null,downRoller=false;
wrap.addEventListener('pointerdown',e=>{
  wrap.setPointerCapture(e.pointerId);active=true;dragging=open;
  sy=ly=e.clientY;lt=performance.now();moved=0;vel=0;
  downEl=e.target.closest('.sitem');downRoller=!!e.target.closest('#lc-roller');
  if(dragging)go();
});
wrap.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const now=performance.now(),dy=e.clientY-ly;
  moved=Math.max(moved,Math.abs(e.clientY-sy));
  pos-=dy/SPY;
  vel=vel*.6+(-(dy/SPY)/Math.max(.008,(now-lt)/1000))*.4;ly=e.clientY;lt=now;
  go();
});
function endPress(cancel){
  if(!active)return;active=false;
  if(dragging){
    dragging=false;
    if(cancel||moved<=6){target=Math.round(pos);}
    else{target=Math.round(pos+clamp(vel,-14,14)*.16);go();return;}
    go();
  }
  if(cancel||moved>6)return;
  if(downEl&&open){
    const i=+downEl.dataset.i,d=mod(i-pos+N/2,N)-N/2;
    setT(Math.round(pos+d));
  }else if(downRoller)setOpen(!open);
  else if(open)setOpen(false);
}
wrap.addEventListener('pointerup',()=>endPress(false));
wrap.addEventListener('pointercancel',()=>endPress(true));
let wacc=0;
wrap.addEventListener('wheel',e=>{
  if(!open)return;e.preventDefault();wacc+=e.deltaY;
  while(Math.abs(wacc)>=40){setT(Math.round(target)+Math.sign(wacc));wacc-=Math.sign(wacc)*40;}
},{passive:false});
lcOn(document,'pointerdown',e=>{if(open&&!wrap.contains(e.target))setOpen(false);});
lcOn(document,'keydown',e=>{
  if(e.key==='Escape')setOpen(false);
  else if(e.key==='ArrowUp'){e.preventDefault();setT(Math.round(target)-1);}
  else if(e.key==='ArrowDown'){e.preventDefault();setT(Math.round(target)+1);}
});

hint.textContent=HC;
go();

}

  const rr=Math.min(19,(r.bottom-r.top)/2);
  return{clip:'inset('+(r.top-er.top).toFixed(1)+'px '+(er.right-r.right).toFixed(1)+'px '+(er.bottom-r.bottom).toFixed(1)+'px '+(r.left-er.left).toFixed(1)+'px round '+rr.toFixed(1)+'px)',
    ox:((r.left+r.right)/2-er.left).toFixed(1),oy:((r.top+r.bottom)/2-er.top).toFixed(1)};
}
const LP_TT_FULL='inset(0px 0px 0px 0px round 0px)';
function lpTTOpen(){
  const T=_lpTT;if(T.busy||T.open)return;
  lpTTBuild();T.busy=true;T.open=true;
  const el=T.el,box=T.box,f=lpTTFrom();
  const rm=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  el.classList.add('on');el.setAttribute('aria-hidden','false');
  box.style.transformOrigin=f.ox+'px '+f.oy+'px';
  const done=()=>{try{a1&&a1.cancel();a2&&a2.cancel()}catch(e){}T.busy=false;try{T.btn.focus({preventScroll:true})}catch(e){}};
  let a1=null,a2=null;
  if(!el.animate||rm){done();return}
  const dur=640,ease='cubic-bezier(.2,.9,.22,1)';
  a1=el.animate([{clipPath:f.clip,opacity:0,offset:0},{opacity:1,offset:.12},{clipPath:LP_TT_FULL,opacity:1,offset:1}],{duration:dur,easing:ease});
  a2=box.animate([{transform:'scale(.5)',opacity:0,offset:0},{opacity:1,offset:.35},{transform:'scale(1)',opacity:1,offset:1}],{duration:dur,easing:ease});
  a1.onfinish=done;
}
function lpTTClose(){
  const T=_lpTT;if(!T.open||T.busy)return;
  T.busy=true;
  const el=T.el,box=T.box,f=lpTTFrom();
  const rm=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  let a1=null,a2=null;
  const done=()=>{el.classList.remove('on');el.setAttribute('aria-hidden','true');try{a1&&a1.cancel();a2&&a2.cancel()}catch(e){}
    try{T.el.querySelector('.tt-f').contentWindow.postMessage('pause','*')}catch(e){}
    T.open=false;T.busy=false;const go=document.getElementById('lpCapGo');try{go&&go.focus({preventScroll:true})}catch(e){}};
  if(!el.animate||rm){done();return}
  box.style.transformOrigin=f.ox+'px '+f.oy+'px';
  const dur=520,ease='cubic-bezier(.4,0,.15,1)';
  a1=el.animate([{clipPath:LP_TT_FULL,opacity:1,offset:0},{opacity:1,offset:.78},{clipPath:f.clip,opacity:0,offset:1}],{duration:dur,easing:ease,fill:'forwards'});
  a2=box.animate([{transform:'scale(1)',opacity:1,offset:0},{opacity:0,offset:.7},{transform:'scale(.5)',opacity:0,offset:1}],{duration:dur,easing:ease,fill:'forwards'});
  a1.onfinish=done;
}
window.lpCapEnter=lpTTOpen;

</script>

<script>
/* press feedback + haptic for taps across the app */
(function(){
  var TARGET='button,a,.sw,.card,.bk,.d,.sleeve-in,nav a,.b,.pick,input[type=checkbox],input[type=radio],select';
  function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
  document.addEventListener('pointerdown',function(e){
    var t=e.target&&e.target.closest?e.target.closest(TARGET):null;
    if(!t)return;
    t.classList.add('pressed');
    buzz(t.matches('nav a')?12:8);
  },true);
  function clear(e){
    var t=e.target&&e.target.closest?e.target.closest('.pressed'):null;
    if(t)setTimeout(function(){t.classList.remove('pressed')},160);
  }
  document.addEventListener('pointerup',clear,true);
  document.addEventListener('pointercancel',clear,true);
  var st=document.createElement('style');
  st.textContent='.pressed{transform:scale(.965)!important;filter:brightness(.97);transition:transform .12s cubic-bezier(.3,.7,.4,1),filter .12s!important}'
    +'.card,button,a{-webkit-tap-highlight-color:transparent;transition:transform .18s cubic-bezier(.3,.7,.4,1),background .25s,box-shadow .25s}';
  document.head.appendChild(st);
})();

/* ---- stay signed in on this device: unlock with the remembered key, no password ---- */
async function lpAutoUnlock(){
  try{
    const r=JSON.parse(lpGet('lp:rem')||'null');
    if(!r||!r.s||!r.k)return false;
    const u=lpUsers(),rec=u[r.s];
    if(!rec||!rec.key)return false;
    const raw=Uint8Array.from(atob(r.k),c=>c.charCodeAt(0));
    const aes=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},true,['encrypt','decrypt']);
    await lpUnlock(rec.key,aes);
    lpSet('lp:active',r.s);
    KEY=rec.key;LOADFAIL=!!window.LPBAD;S=load();ens();if(!S.name)S.name=rec.name;save();applyTheme();
    try{if(typeof applyLang=='function')applyLang()}catch(e){}
    return true;
  }catch(e){console.error(e);return false}
}
lpAutoUnlock().then(function(ok){if(ok){try{render()}catch(e){}}});
</script>
