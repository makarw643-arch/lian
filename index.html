<style>
/* ============ Lian Planner — design tokens & performance-first CSS ============ */
:root{
  --font-body:"Vazirmatn","IRANSansX","IRANSans","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
  --font-serif:Georgia,"Iowan Old Style","Baskerville","Times New Roman","Noto Naskh Arabic",serif;
  --font-mono:"SF Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
  --r-xl:30px; --r-lg:24px; --r-md:16px; --r-sm:12px;
  --tx:#24231f; --mu:#5f5b4e; --ln:rgba(56,52,44,.14); --ln2:rgba(56,52,44,.08);
  --pk:#a98a4f; --pk2:#c7a86a; --pk3:#7d6435; --onpk:#241c0d;
  --gold:#b99a5b;
  --acc:169,138,79; --accl:#e8dcc3; --pd:190,104,128;
  --gl:rgba(255,255,255,.72); --gl2:rgba(255,255,255,.28); --glb:rgba(255,255,255,.85); --gsh:rgba(93,82,58,.12);
  --b1:#efece4; --b2:#dfe7d9; --b3:#e9c9cb; --b4:#4a4a48; --bgc:#fbf8f0;
  --card:rgba(255,253,247,.82); --card2:rgba(248,244,234,.72); --card-solid:#f8f5ed; --nav:rgba(255,253,247,.94);
  --bg:#efece4; --bg2:#f7f4ec;
  --sh:rgba(88,78,58,.18); --glow:rgba(202,173,116,.26); --glow2:rgba(255,255,255,.55);
  --ringtrack:rgba(60,55,45,.11); --placeholder:#8b8475;
  --danger:#9d3d3a; --ok:#547a4e;
  --shadow-sheet:0 1px 0 var(--gl) inset,0 22px 46px -34px var(--sh);
}
/* light themes */
html[data-theme="ivory"]{
  --tx:#24231f; --mu:#5f5b4e; --ln:rgba(56,52,44,.14); --ln2:rgba(56,52,44,.08);

}

  --acc:51,80,111; --accl:#dde6ef; --pd:118,136,168;
  --bg:#e7ecf2; --bg2:#f2f5f9; --card:rgba(251,253,255,.84); --card2:rgba(235,241,247,.76); --card-solid:#f8fbff; --nav:rgba(250,253,255,.95);

  --acc:95,139,128; --accl:#dbe9e4; --pd:134,160,170;
  --bg:#ecf1ee; --bg2:#f7faf8; --card:rgba(251,254,252,.82); --card2:rgba(235,242,239,.76); --card-solid:#f8fcfa; --nav:rgba(250,253,251,.95);
  --sh:rgba(45,75,68,.18); --glow:rgba(165,190,205,.34); --glow2:rgba(226,219,244,.5);
}
html[data-theme="stone"]{

  --pk:#303236; --pk2:#8C877F; --pk3:#292A2C; --gold:#77736D; --onpk:#F4F0E7;
  --acc:48,50,54; --accl:#E8E2D7; --pd:#B08F80;
  --bg:#F4F0E7; --bg2:#FAF7F0; --card:#E8E2D7; --card2:#EFEAE1; --card-solid:#F2EEE6; --nav:rgba(244,240,231,.96);
  --sh:rgba(41,42,44,.13); --glow:rgba(119,115,109,.14); --glow2:rgba(255,255,255,.45);
}
html[data-mode="dark"][data-theme="stone"]{
  --tx:#F1EDE4; --mu:#B4AEA4; --ln:rgba(255,255,255,.16); --ln2:rgba(255,255,255,.08);
  --pk:#D9D2C5; --pk2:#A7A198; --pk3:#EFEAE1; --gold:#C9C1B4; --onpk:#1B1C1E;
  --acc:217,210,197; --accl:#3A3935; --pd:190,150,132;
  --bg:#1B1C1E; --bg2:#232426; --card:#292A2C; --card2:#242527; --card-solid:#303236; --nav:rgba(35,36,38,.97);
  --sh:rgba(0,0,0,.5); --glow:rgba(232,226,215,.08); --glow2:rgba(255,255,255,.03);
}
/* generic dark mode (after light themes so it wins) */
html[data-mode="dark"]{
  --tx:#f2eee5; --mu:#b7afa2; --ln:rgba(255,255,255,.15); --ln2:rgba(255,255,255,.07);
  --gl:rgba(255,255,255,.16); --gl2:rgba(255,255,255,.05); --glb:rgba(255,255,255,.18); --gsh:rgba(0,0,0,.35);
  --card:rgba(39,37,33,.84); --card2:rgba(28,27,24,.8); --card-solid:#242320; --nav:rgba(37,35,31,.96);
  --bg:#161513; --bg2:#1e1c19; --ringtrack:rgba(255,255,255,.13); --placeholder:#9c9487;
  --sh:rgba(0,0,0,.6); --glow:rgba(196,164,105,.16); --glow2:rgba(255,255,255,.04);
  --danger:#e79b95; --ok:#a3c295; --onpk:#1b1609;
}
html[data-mode="dark"][data-theme="ivory"]{--pk:#d6b579;--pk2:#ecd6a7;--pk3:#c3a062;--gold:#d6b579;--acc:214,181,121;--accl:#3d3423;--onpk:#221a0a;--pd:196,132,152;}
html[data-mode="dark"][data-theme="graphite"]{--pk:#aebac2;--pk2:#d5dde2;--pk3:#93a1aa;--gold:#aebac2;--acc:174,186,194;--accl:#333b40;--onpk:#171c1f;--pd:164,146,162;}
html[data-mode="dark"][data-theme="pink"]{--pk:#e3aab3;--pk2:#f4cfd5;--pk3:#cf919d;--gold:#dcb0a4;--acc:227,170,179;--accl:#4a2930;--onpk:#311a1f;--pd:210,134,154;}
html[data-mode="dark"][data-theme="cherry"]{--pk:#d7858a;--pk2:#f0b8b6;--pk3:#bc666c;--gold:#d3ae84;--acc:215,133,138;--accl:#4b2425;--onpk:#2a1113;--pd:214,122,136;}
html[data-mode="dark"][data-theme="navy"]{--pk:#9fb6d2;--pk2:#cfdceb;--pk3:#839dbd;--gold:#d8bc80;--acc:159,182,210;--accl:#29394c;--onpk:#111b26;--pd:154,170,201;}
html[data-mode="dark"][data-theme="liquid"]{--pk:#a9cfc3;--pk2:#d8ebe5;--pk3:#8db8ab;--gold:#cfc3a4;--acc:169,207,195;--accl:#2b403b;--onpk:#14211e;--pd:158,186,194;}
html[data-mode="dark"][data-theme="graphite"]{--bg:#1a1c1d;--bg2:#232527;}
html[data-mode="dark"][data-theme="pink"]{--bg:#241a1d;--bg2:#302126;}
html[data-mode="dark"][data-theme="cherry"]{--bg:#231516;--bg2:#2f1c1d;}
html[data-mode="dark"][data-theme="navy"]{--bg:#0f1620;--bg2:#17202c;}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain;overflow-x:clip}
body{
  margin:0;min-height:100dvh;color:var(--tx);font-family:var(--font-body);font-size:15px;line-height:1.65;
  overscroll-behavior-y:contain;overflow-x:clip;-webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  background-image:
    radial-gradient(1100px 620px at 88% -12%,var(--glow),transparent 62%),
    radial-gradient(900px 520px at -8% 18%,var(--glow2),transparent 60%),
    linear-gradient(168deg,var(--bg2),var(--bg) 46%,var(--bg2));
  background-attachment:scroll;
}
[data-act],a,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::selection{background:rgba(var(--acc),.3)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--pk);outline-offset:3px}
::placeholder{color:var(--placeholder);opacity:1}
input,select,textarea{font-size:16px}
input[type=range]{accent-color:var(--pk)}
.mono{font-family:var(--font-mono)}
.serif{font-family:var(--font-serif)}
.mu{color:var(--mu)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* no page-wide grain, blur, blend modes or orbs */
#app{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column}
/* ======= chrome ======= */
.topbar{max-width:1180px;width:100%;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) clamp(12px,3vw,26px) 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;flex:1 1 auto;min-width:0}
.brand-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:#000;overflow:hidden;flex:none}
.brand-mark svg{width:100%;height:100%;display:block}
.app-logo{display:block;width:100%;height:auto}
.lock-logo{width:64px;height:64px;border-radius:18px;overflow:hidden;background:#000;margin-bottom:14px}
.lock-logo svg{width:100%;height:100%;display:block}
.ambient-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:10px;color:var(--mu);min-width:0}
.ambient-note b{color:var(--tx);font-weight:600}
.mini-brand{display:flex;align-items:center;gap:9px;min-width:0}
.mini-brand .app-logo{width:28px;height:28px;border-radius:8px;background:#000;flex:none}
.builtin-tag{font-size:8px;font-family:var(--font-mono);letter-spacing:.06em;border:1px solid var(--ln);border-radius:6px;padding:1px 4px;color:var(--mu);flex:none}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-txt strong{font-family:var(--font-serif);font-weight:600;font-size:21px;letter-spacing:.2px;line-height:1.1;white-space:nowrap}
.brand-txt strong em{font-style:italic;font-weight:400;color:var(--pk3);margin-inline-start:2px}
.brand-txt small{font-size:8.5px;letter-spacing:.22em;color:var(--mu);font-family:var(--font-mono);white-space:nowrap}
.datepill{display:flex;align-items:center;gap:8px;min-height:44px;padding:5px 8px 5px 14px;border-radius:999px;border:1px solid var(--ln);background:linear-gradient(150deg,var(--card),var(--card2));box-shadow:0 1px 0 var(--gl) inset,0 8px 22px -20px var(--sh);font-size:12.5px;color:var(--mu);white-space:nowrap}
.datepill .sun-btn{width:34px;height:34px;min-height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.7),rgba(var(--acc),.18));box-shadow:0 1px 0 var(--gl) inset,0 4px 10px -6px var(--sh);color:var(--pk3);font-size:15px;flex:none}
.datepill b{color:var(--tx);font-weight:600}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.namechip{display:flex;align-items:center;gap:7px;min-height:44px;padding:4px 5px 4px 12px;border-radius:999px;border:1px solid var(--ln);background:linear-gradient(150deg,var(--card),var(--card2));box-shadow:0 1px 0 var(--gl) inset;font-size:12.5px;max-width:150px}
.namechip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--pk2),var(--pk3));color:var(--onpk);font-family:var(--font-serif);font-size:15px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ln);background:linear-gradient(150deg,var(--card),var(--card2));box-shadow:0 1px 0 var(--gl) inset;color:var(--tx);font-size:11px;font-family:var(--font-mono);letter-spacing:.04em}
.icon-btn svg{width:19px;height:19px}
.sound-txt{display:none}
.cal-top,.cal-week,.cal-grid,.cal-foot{position:relative;z-index:1}
@media(max-width:700px){
  .brand-txt small{display:none}
  .brand-txt strong{font-size:18px}
  .brand-mark{width:34px;height:34px;font-size:19px;border-radius:11px}
  .namechip span{display:none}
  .namechip{padding:4px;border-radius:50%}
  .datepill{order:3;flex:1 1 100%;justify-content:center;padding:6px 12px;font-size:12px}
  .datepill .sun-btn{position:absolute;inset-inline-start:18px;width:30px;height:30px;min-height:30px}
  .datepill{position:relative}
  .top-actions{order:2}
  .sound-txt{display:none}
}
/* ======= layout ======= */
main{flex:1;width:100%}
.page{display:none}
.page.active{display:block;animation:pageIn .22s cubic-bezier(.22,1,.36,1) both;will-change:opacity,transform}
@keyframes pageIn{from{opacity:0;transform:translate3d(0,6px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.page-inner{max-width:1180px;margin:0 auto;padding:8px clamp(12px,3vw,26px) 128px}
.card{border-radius:var(--r-lg);border:1px solid var(--ln);background:linear-gradient(155deg,var(--card),var(--card2));box-shadow:var(--shadow-sheet);padding:clamp(14px,2.4vw,22px);position:relative}
.card.flat{background:linear-gradient(155deg,var(--card2),var(--card));box-shadow:0 1px 0 var(--gl2) inset}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 2px 12px;flex-wrap:wrap}
.section-head h2,.h2{font-size:clamp(20px,2.6vw,26px);font-weight:700;letter-spacing:-.2px;line-height:1.3}
.section-head p{color:var(--mu);font-size:12px;margin-top:2px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:9px;letter-spacing:.24em;color:var(--pk3);text-transform:uppercase;margin-bottom:5px}
.eyebrow::before{content:"";width:16px;height:1px;background:currentColor;opacity:.7}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-title{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:7px;line-height:1.4}
.card-sub{font-size:11px;color:var(--mu);margin-top:1px}
.serif-en{font-family:var(--font-serif);font-style:italic;letter-spacing:.3px}
.divider{height:1px;background:var(--ln);border:0;margin:12px 0}
.note{font-size:11px;color:var(--mu)}
.cv{content-visibility:auto;contain-intrinsic-size:auto 320px}
/* ======= controls ======= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:10px 17px;border-radius:999px;border:1px solid var(--ln);background:linear-gradient(150deg,var(--card-solid),var(--card2));font-size:13px;font-weight:600;color:var(--tx);box-shadow:0 1px 0 var(--gl) inset,0 6px 14px -12px var(--sh);transition:transform .16s ease,opacity .16s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(145deg,var(--pk),var(--pk3));color:var(--onpk);border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 10px 22px -14px var(--sh)}
.btn.ghost{background:var(--gl2);box-shadow:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:12px}
.btn.danger{color:#fff;background:linear-gradient(145deg,#a34b45,#772f2b);border-color:transparent}
.btn svg{width:17px;height:17px;flex:none}
.btn .k{font-family:var(--font-mono);font-size:10px;opacity:.7}
.addbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:7px 14px;border-radius:999px;background:linear-gradient(145deg,var(--pk),var(--pk3));color:var(--onpk);font-size:12.5px;font-weight:600;box-shadow:0 10px 20px -16px var(--sh);border:0}
.addbtn.light{background:var(--gl2);color:var(--tx);border:1px solid var(--ln)}
.mini-link{color:var(--pk3);font-size:11.5px;font-weight:600;min-height:36px;display:inline-flex;align-items:center;gap:4px;padding:0 4px}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:11px 14px;border-radius:14px;border:1px solid var(--ln);background:linear-gradient(160deg,var(--card-solid),var(--card2));color:var(--tx);outline:0;box-shadow:0 1px 0 var(--gl) inset}
textarea.input{min-height:90px;resize:vertical;line-height:1.8}
.input:focus{border-color:var(--pk);box-shadow:0 0 0 3px rgba(var(--acc),.16)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>label,.label{font-size:11.5px;color:var(--mu);font-weight:600}
.inline-form{display:flex;gap:7px;align-items:center}
.inline-form .input{min-height:44px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--gl2);border:1px solid var(--ln);gap:2px}
.seg button{min-height:36px;padding:5px 13px;border-radius:999px;font-size:12px;color:var(--mu);font-weight:600}
.seg button.on{background:var(--card-solid);color:var(--tx);box-shadow:0 1px 0 var(--gl) inset,0 3px 8px -6px var(--sh)}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:5px 11px;border-radius:999px;border:1px solid var(--ln);background:var(--gl2);font-size:11.5px;color:var(--mu)}
.chip.on{border-color:var(--pk);color:var(--pk3);background:rgba(var(--acc),.12)}
.check{width:24px;height:24px;min-height:24px;border-radius:8px;border:1.5px solid var(--ln);display:grid;place-items:center;background:var(--gl2);color:transparent;flex:none;padding:0}
.check.on{background:linear-gradient(145deg,var(--pk),var(--pk3));border-color:transparent;color:var(--onpk)}
.check svg{width:14px;height:14px}
.icon-tile{width:44px;height:44px;min-height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--ln);background:var(--gl2);flex:none}
.dots-nav{display:flex;gap:4px;align-items:center}
/* ======= dashboard ======= */
.hero{overflow:hidden;padding:clamp(18px,3.4vw,30px);display:grid;grid-template-columns:1.4fr .6fr;gap:14px;align-items:center;min-height:182px}
.hero::after{content:"";position:absolute;inset-inline-end:-30px;bottom:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(var(--acc),.18),transparent 66%);pointer-events:none}
.hero-title{font-family:var(--font-serif);font-size:clamp(30px,6vw,52px);line-height:1.02;letter-spacing:-1px;font-weight:600;margin:2px 0}
.hero-title em{font-style:italic;color:var(--pk3)}
.hero-fa{font-size:clamp(17px,2.8vw,22px);font-weight:700;line-height:1.45;margin-bottom:4px}
.hero-quote{color:var(--mu);font-size:12px;max-width:42ch;margin-top:6px}
.hero-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hero-ring{display:flex;justify-content:center}
@media(max-width:700px){.hero{grid-template-columns:1fr;min-height:0}.hero-ring{order:-1}.hero{text-align:center}.hero .eyebrow{justify-content:center}.hero-meta{justify-content:center}}
.dash-grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr);margin-top:14px}
.dash-grid>.card{grid-column:span 6;min-width:0}
.dash-grid>.span4{grid-column:span 4}
.dash-grid>.span8{grid-column:span 8}
.dash-grid>.span12{grid-column:span 12}
@media(max-width:860px){.dash-grid>.card,.dash-grid>.span4,.dash-grid>.span8{grid-column:span 12}}
@media(min-width:861px) and (max-width:1100px){.dash-grid>.card{grid-column:span 6}}
.tasks-list{display:flex;flex-direction:column;gap:2px}
.task-row{display:flex;align-items:center;gap:9px;min-height:46px;border-bottom:1px solid var(--ln2);padding:3px 0}
.task-row:last-child{border-bottom:0}
.task-row .t-txt{flex:1;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.task-row.done .t-txt{color:var(--mu);text-decoration:line-through;text-decoration-thickness:1px}
.task-actions{display:flex;gap:0;flex:none}
.tiny-btn{width:36px;height:36px;min-height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mu)}
.tiny-btn svg{width:15px;height:15px}
.tiny-btn.star.on{color:var(--pk3)}
.tiny-btn:hover{background:var(--gl2)}
.empty{padding:14px 6px;text-align:center;color:var(--mu);font-size:12px;line-height:1.9}
.mood-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mood-btn{width:46px;height:50px;min-height:46px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid transparent;background:var(--gl2);font-size:21px;line-height:1;padding:4px 0;transition:transform .16s ease}
.mood-btn small{font-size:7.5px;color:var(--mu);line-height:1.2;max-width:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mood-btn.on{border-color:var(--pk);background:rgba(var(--acc),.15);transform:translateY(-3px)}
.mood-note{width:100%;margin-top:10px;font-size:11px;color:var(--mu);text-align:center;overflow-wrap:anywhere}
/* ring */
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.ring3d{--p:0;width:var(--rw,150px);aspect-ratio:1;border-radius:50%;position:relative;background:conic-gradient(from -90deg,var(--pk) calc(var(--p)*1%),var(--ringtrack) 0);box-shadow:var(--shadow-card);transition:background .3s ease}
.ring3d::before{content:"";position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 38% 26%,var(--card-solid),var(--card2) 65%,var(--card-solid))}
.ring-val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;pointer-events:none}
.ring-val b{font-family:var(--font-serif);font-size:calc(var(--rw,150px)*.24);font-weight:600;line-height:1;letter-spacing:-1px}
.ring-val b i{font-style:normal;font-size:.5em;color:var(--mu);margin-inline-start:2px}
.ring-val small{font-size:9px;letter-spacing:.14em;color:var(--mu);margin-top:5px;font-family:var(--font-mono)}
.ring-shadow{width:60%;height:8px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.18),transparent 70%);margin-top:-4px}
.ring-label{font-size:10.5px;color:var(--mu);text-align:center}
.rings-week{display:flex;gap:4px;justify-content:space-between;margin-top:6px}
.mini-ring{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:8.5px;color:var(--mu);min-width:0}
.mini-ring .mr{--p:0;width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;background:conic-gradient(from -90deg,var(--pk) calc(var(--p)*1%),var(--ringtrack) 0);display:grid;place-items:center;box-shadow:0 4px 8px -7px var(--sh)}
.mini-ring .mr::before{content:attr(data-p);width:72%;height:72%;border-radius:50%;background:var(--card-solid);display:grid;place-items:center;font-family:var(--font-mono);font-size:8px;color:var(--mu)}
.mini-ring.today span{color:var(--pk3);font-weight:700}
/* radar */
.radar-wrap{width:100%;max-width:440px;margin:0 auto;position:relative}
.radar-svg{width:100%;height:auto;display:block;overflow:visible}
.radar-svg text{font-family:var(--font-body);font-size:10.5px;fill:var(--mu)}
.radar-svg .axis-label{font-weight:600;fill:var(--tx)}
.radar-svg .ring-line{fill:none;stroke:var(--ln);stroke-width:.8}
.radar-svg .spoke{stroke:var(--ln);stroke-width:.8}
.radar-svg .layer-all{fill:rgba(var(--acc),.18);stroke:var(--pk);stroke-width:1.6}
.radar-svg .layer-7{fill:rgba(var(--acc),.09);stroke:var(--pk2);stroke-width:1.2;stroke-dasharray:3 3}
.radar-svg .num{font-family:var(--font-mono);font-size:8.5px;fill:var(--mu)}
.radar-dots{display:flex;gap:3px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.radar-dots i{width:8px;height:8px;border-radius:50%;background:var(--ringtrack);display:block;border:1px solid transparent}
.radar-dots i.logged{border-color:var(--ln)}
.radar-leg{display:flex;gap:12px;justify-content:center;font-size:9px;color:var(--mu);margin-top:6px;flex-wrap:wrap}
.radar-leg b{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:4px}
.mood-key{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px}
.mood-key span{font-size:8.5px;color:var(--mu);display:inline-flex;align-items:center;gap:3px;padding:2px 5px;border-radius:6px;background:var(--gl2)}
.mood-key i{width:6px;height:6px;border-radius:50%;display:inline-block}
/* focus */
.focus-time{font-family:var(--font-mono);font-size:clamp(38px,9vw,52px);font-weight:500;letter-spacing:-2px;line-height:1;text-align:center;margin:8px 0 2px}
.focus-row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.focus-row .btn{min-height:40px;padding:6px 12px;font-size:12px}
.planets{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.planet{font-size:17px;opacity:.28;position:relative}
.planet.on{opacity:1}
.points{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;color:var(--mu)}
.points b{color:var(--pk3);font-family:var(--font-mono)}
/* reminders */
.rem-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--ln2);min-height:42px;min-width:0;width:100%}
.rem-row:last-child{border-bottom:0}
.rem-time{font-family:var(--font-mono);font-size:10px;padding:2px 5px;border-radius:7px;background:var(--gl2);flex:0 0 auto;max-width:64px;overflow:hidden;text-overflow:ellipsis}
.rem-row .txt{flex:1 1 60px;min-width:0;font-size:12px;line-height:1.45;overflow-wrap:anywhere}
.rem-row .check{width:20px;min-width:20px;height:20px;min-height:20px}
.rem-row .tiny-btn{width:28px;min-width:28px;height:28px;min-height:28px;font-size:14px}
.rem-row.off{opacity:.5}
/* mini vinyl strip */
.vinyl-strip{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;overflow:hidden}
.vinyl-strip .disc{width:48px;height:48px;border-radius:50%;flex:none;background:repeating-radial-gradient(circle,rgba(255,255,255,.16) 0 1px,#191919 1px 4px);display:grid;place-items:center;box-shadow:0 6px 14px -8px rgba(0,0,0,.6)}
.vinyl-strip .disc b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--pk),var(--pk3));color:var(--onpk);font-family:var(--font-serif);font-size:9px}
.vinyl-strip .vs-title{flex:1;min-width:0}
.vinyl-strip .vs-title b{display:block;font-family:var(--font-serif);font-style:italic;font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vinyl-strip .vs-title small{font-size:10px;color:var(--mu)}
.vs-eq{display:flex;gap:2px;align-items:flex-end;height:14px}
.vs-eq i{width:2px;background:var(--pk);border-radius:1px;height:40%}
.vs-eq i:nth-child(2){height:75%}.vs-eq i:nth-child(3){height:55%}.vs-eq i:nth-child(4){height:95%}
/* ======= habits ======= */
.month-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.month-label{display:flex;flex-direction:column;line-height:1.2;text-align:center;min-width:92px}
.month-label b{font-size:14px}
.month-label small{font-family:var(--font-mono);font-size:9px;color:var(--mu);letter-spacing:.1em}
.habit-scroll{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;border-radius:14px;border:1px solid var(--ln2);scrollbar-width:thin}
.habit-table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:11px}
.habit-table th,.habit-table td{padding:0;text-align:center;border-bottom:1px solid var(--ln2);border-inline-start:1px solid var(--ln2)}
.habit-table thead th{position:sticky;top:0;z-index:3;background:var(--card-solid);font-weight:500;height:42px;color:var(--mu)}
.habit-table tbody th{position:sticky;inset-inline-start:0;z-index:2;background:var(--card-solid);min-width:112px;max-width:112px;width:112px;text-align:start;padding:6px 8px;font-weight:600;font-size:11px;box-shadow:1px 0 0 var(--ln2) inset}
.habit-name{display:flex;align-items:center;gap:6px;min-width:0}
.habit-name i{font-style:normal;font-size:15px;flex:none}
.habit-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.habit-name .hm{display:flex;gap:1px;margin-inline-start:auto;flex:none;opacity:0}
.habit-table tbody tr:hover .hm,.habit-table tbody tr:focus-within .hm{opacity:1}
.hm button{width:22px;height:22px;min-height:22px;border-radius:6px;display:grid;place-items:center;color:var(--mu);font-size:11px}
.hm button svg{width:12px;height:12px}
.hday{width:44px;min-width:44px;height:44px;min-height:44px;border-radius:10px;display:inline-grid;place-items:center;border:1px solid var(--ln2);background:var(--gl2);color:var(--mu);margin:1px;font-size:12px;padding:0;transition:transform .16s ease,background .16s ease}
.hday.on{background:linear-gradient(145deg,var(--pk),var(--pk3));color:var(--onpk);border-color:transparent}
.hday.pop{animation:pop .26s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.24)}100%{transform:scale(1)}}
.hday.today{box-shadow:0 0 0 1px var(--pk)}
.hday.future{opacity:.4}
.habit-table .dow{font-size:8px;display:block;line-height:1.2;font-family:var(--font-mono);letter-spacing:.03em}
.habit-table .dnum{font-size:10.5px;display:block;line-height:1.25}
.habit-table th.is-today{background:rgba(var(--acc),.14);color:var(--pk3)}
.habit-table td.is-today{background:rgba(var(--acc),.06)}
.habit-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:10px;color:var(--mu)}
.habit-grid-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--mu)}
.legend-dot{width:8px;height:8px;border-radius:3px;display:inline-block;margin-inline-end:4px;vertical-align:middle}
/* year chart */
.year-bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;min-height:150px;padding-top:12px;overflow:hidden}
.ybar{display:flex;flex-direction:column;align-items:center;gap:5px;height:134px;min-height:134px;padding:0;background:none;justify-content:flex-end}
.ybar-track{width:100%;max-width:24px;height:104px;border-radius:99px;background:var(--ringtrack);display:flex;align-items:flex-end;overflow:hidden}
.ybar-fill{width:100%;border-radius:99px;background:linear-gradient(180deg,var(--pk2),var(--pk3));min-height:3px;height:3%}
.ybar.on .ybar-track{outline:2px solid var(--pk);outline-offset:2px}
.ybar small{font-size:8px;color:var(--mu);font-family:var(--font-mono);white-space:nowrap}
.ybar b{font-size:8px;color:var(--pk3);font-family:var(--font-mono);font-weight:500}
.medal-levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.medal-lv{border:1px solid var(--ln2);border-radius:12px;padding:6px 3px;text-align:center;font-size:9.5px;color:var(--mu);background:var(--gl2)}
.medal-lv b{display:block;font-size:16px;line-height:1.4}
.medal-lv.on{border-color:var(--pk);color:var(--pk3);background:rgba(var(--acc),.1)}
.big-medal{display:flex;align-items:center;gap:12px}
.big-medal .bm{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 34% 28%,var(--gl),rgba(var(--acc),.24));border:1px solid var(--ln);flex:none;box-shadow:0 1px 0 var(--gl) inset,0 10px 20px -18px var(--sh)}
.big-medal .bm small{position:absolute}
/* sleep */
.sleep-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sleep-bars{display:flex;gap:6px;margin-top:12px;align-items:flex-end;height:74px}
.sleep-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.sleep-bar .sb{width:100%;max-width:34px;border-radius:10px;background:linear-gradient(180deg,var(--pk2),var(--pk3));min-height:3px;max-height:50px}
.sleep-bar .sb.empty{background:var(--ringtrack)}
.sleep-bar small{font-size:7.5px;color:var(--mu);white-space:nowrap;font-family:var(--font-mono)}
.sleep-bar span{font-size:8px;color:var(--mu);font-family:var(--font-mono)}
/* ======= notes / shelf ======= */
.bookshelf{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;padding:24px 8px 18px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.book{flex:0 0 auto;scroll-snap-align:center;width:clamp(112px,30vw,152px);aspect-ratio:3/4.15;border-radius:6px 16px 16px 6px;border:1px solid rgba(255,255,255,.22);position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:14px 11px;text-align:center;box-shadow:0 12px 22px -18px rgba(30,25,18,.55),2px 0 0 rgba(0,0,0,.12) inset;transition:transform .22s ease;overflow:visible;min-height:0}
.book:active{transform:scale(.98)}
.book.focus{transform:translateY(-8px) scale(1.035);box-shadow:0 20px 32px -20px rgba(30,25,18,.6),3px 0 0 rgba(0,0,0,.16) inset}
.book::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:7px;border-radius:6px 0 0 6px;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.08));pointer-events:none}
.book .bk-eyebrow{font-family:var(--font-mono);font-size:7px;letter-spacing:.18em;opacity:.7}
.book .bk-title{font-family:var(--font-serif);font-style:italic;font-size:clamp(15px,4vw,20px);line-height:1.25;font-weight:600;overflow-wrap:anywhere}
.book .bk-count{font-family:var(--font-mono);font-size:8px;opacity:.72}
.book .bk-sticker{position:absolute;font-size:20px;line-height:1;pointer-events:none}
.bk-cream{background:linear-gradient(150deg,#fbf5e9,#efe3cf 70%,#e0d2ba);color:#453a29}
.bk-green{background:linear-gradient(150deg,#dfe9da,#b9cbb4 70%,#a3b79e);color:#293a2a}
.bk-rose{background:linear-gradient(150deg,#f1d7d8,#d5a7ac 70%,#c49197);color:#4a2428}
.bk-graphite{background:linear-gradient(150deg,#5b5b58,#353533 70%,#222221);color:#f1ede3}
.bk-daily{background:linear-gradient(150deg,#f3e9d4,#e3d2ad 70%,#cdb98d);color:#44351d}
.bk-daily .bk-title{font-family:var(--font-serif);font-size:15px}
html[data-mode="dark"] .bk-cream,html[data-mode="dark"] .bk-daily{filter:none}
/* book modal */
.modal.book-modal{max-width:1080px}
.book-stage{display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:start}
.book-cover{position:relative;border-radius:8px 20px 20px 8px;aspect-ratio:3/4.15;padding:18px 14px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;overflow:hidden;min-height:220px}
.book-cover .cov-stk{position:absolute;transform-origin:center;touch-action:none;cursor:grab;display:grid;place-items:center;z-index:3}
.cov-stk.emoji{font-size:22px}
.cov-stk.img img{width:100%;height:100%;object-fit:cover;border-radius:8px;box-shadow:0 4px 10px -6px rgba(0,0,0,.6)}
.cov-stk.sel{outline:2px dashed currentColor;outline-offset:2px;border-radius:8px}
.spread{display:grid;grid-template-columns:1fr 1fr;border-radius:12px;overflow:hidden;box-shadow:0 20px 34px -26px rgba(20,16,15,.6),0 0 0 1px rgba(90,75,55,.16);position:relative;background:#fbf6ea;color:#3b3226;min-height:min(58vh,480px)}
html[data-mode="dark"] .spread{background:#efe7d7;color:#352d22}
.spread::after{content:"";position:absolute;inset-block:0;inset-inline-start:50%;width:26px;transform:translateX(50%);background:linear-gradient(90deg,rgba(120,100,70,.05),rgba(90,70,45,.22),rgba(120,100,70,.05));pointer-events:none;z-index:4}
html[dir="ltr"] .spread::after{transform:translateX(-50%)}
.note-page{position:relative;padding:16px 14px 28px;min-width:0;display:flex;flex-direction:column;background-image:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(70,60,40,.15) 27px 28px);background-position:0 47px;background-size:100% 28px;overflow:hidden}
.note-page:nth-child(1){border-inline-end:1px solid rgba(90,75,55,.16)}
.note-page.active-page{box-shadow:inset 0 0 0 2px rgba(var(--acc),.42)}
.note-page.leaf{transform-origin:center}
.stk-handle{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--pk3);border:2px solid #fff;inline-size:22px;block-size:22px;bottom:-11px;inset-inline-end:-11px;touch-action:none;cursor:nwse-resize;z-index:10;display:none}
.stk.sel .stk-handle{display:block}
.note-page textarea{flex:1;width:100%;min-height:180px;resize:none;border:0;outline:0;background:transparent;color:inherit;font-family:var(--font-body);font-size:16px;line-height:28px;padding:0;scrollbar-width:thin}
.note-page .pg-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:8px;letter-spacing:.1em;opacity:.68;margin-bottom:6px;min-height:16px}
.note-page .pg-foot{position:absolute;bottom:7px;inset-inline:0;text-align:center;font-family:var(--font-serif);font-size:10px;opacity:.6}
.page-tools{position:absolute;top:2px;inset-inline-end:4px;display:flex;gap:0;z-index:5}
.page-tools button{width:28px;height:28px;min-height:28px;border-radius:7px;display:grid;place-items:center;opacity:.65;color:inherit}
.page-tools button svg{width:13px;height:13px}
.book-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.spread-nav{display:flex;gap:6px;align-items:center}
.spread-nav .icon-btn{width:36px;height:36px;min-height:36px}
.spread-nav .icon-btn svg{width:15px;height:15px}
/* The notebook is the only 3D element. */
#bookSpread{perspective:1200px}
#bookSpread.flip-next .note-page:first-child{transform-origin:100% 50%;animation:pflipR 1.2s ease-in-out both;backface-visibility:hidden}
#bookSpread.flip-prev .note-page:last-child{transform-origin:0 50%;animation:pflipL 1.2s ease-in-out both;backface-visibility:hidden}
#bookSpread.flip-next .note-page:first-child::before,
#bookSpread.flip-prev .note-page:last-child::before{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(55,40,30,.28));animation:shd 1.2s ease-in-out both}
html[dir="rtl"] #bookSpread.flip-next .note-page:first-child{transform-origin:0 50%}
html[dir="rtl"] #bookSpread.flip-prev .note-page:last-child{transform-origin:100% 50%}
@keyframes pflipR{0%{transform:rotateY(0)}100%{transform:rotateY(-74deg)}}
@keyframes pflipL{0%{transform:rotateY(0)}100%{transform:rotateY(74deg)}}
@keyframes shd{0%,100%{opacity:0}48%{opacity:.45}}
.crumple{animation:crumple .42s ease-in forwards;transform-origin:center}
@keyframes crumple{to{opacity:0;transform:scale(.45) rotate(12deg)}}
/* stickers */
.sticker-tray{margin-top:12px;border:1px solid var(--ln);border-radius:16px;background:linear-gradient(150deg,var(--card),var(--card2));padding:10px 12px}
.sticker-tray .tray-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10.5px;color:var(--mu);flex-wrap:wrap}
.sticker-palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sticker-palette button{width:40px;height:40px;min-height:40px;border-radius:12px;border:1px solid var(--ln2);background:var(--gl2);font-size:20px;display:grid;place-items:center;padding:0}
.sticker-palette button.upload{font-size:11px;line-height:1.3;color:var(--mu)}
.stk{position:absolute;transform-origin:center;touch-action:none;display:grid;place-items:center;z-index:6;cursor:grab;user-select:none;-webkit-user-select:none}
.stk.emoji{font-size:22px;line-height:1}
.stk.img img{width:100%;height:100%;object-fit:cover;border-radius:5px;box-shadow:0 3px 8px -4px rgba(0,0,0,.45);pointer-events:none}
.stk.sel{outline:2px dashed rgba(90,75,55,.6);outline-offset:2px;border-radius:6px}
.stk-ctrl{position:sticky;bottom:0;margin-top:10px;display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--card2);border:1px solid var(--ln);border-radius:12px;padding:4px}
.stk-ctrl button{width:36px;height:36px;min-height:36px;border-radius:9px;display:grid;place-items:center;font-size:13px;color:var(--mu)}
.stk-trash{position:fixed;inset-inline-start:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) scale(.7);opacity:0;pointer-events:none;z-index:180;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#8f3630;color:#fff;border:2px dashed rgba(255,255,255,.6);transition:transform .18s ease,opacity .18s ease}
html[dir="ltr"] .stk-trash{transform:translateX(-50%) scale(.7)}
.stk-trash.show{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.stk-trash.hot{background:#b6362e;transform:translateX(-50%) scale(1.12)}
.stk-trash svg{width:22px;height:22px}
.stk-lightbox{position:fixed;inset:0;z-index:205;background:rgba(10,10,10,.72);display:grid;place-items:center;padding:20px}
.stk-lightbox img{max-width:90vw;max-height:82vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
/* gramophone */
.gramo{display:grid;grid-template-columns:minmax(130px,190px) 1fr;gap:14px;align-items:center}
.g-arts{position:relative;height:180px;display:grid;place-items:center}
.discs{position:relative;width:150px;height:150px}
.disc{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.15) 0 1px,#161616 1px 4px,#1e1e1e 4px 5px);box-shadow:0 12px 24px -14px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.4);display:grid;place-items:center;will-change:auto}
.disc .label{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,var(--pk),var(--pk3));color:var(--onpk);display:grid;place-items:center;font-family:var(--font-serif);font-size:14px;border:1px solid rgba(0,0,0,.2)}
.disc.d2{transform:translate(-11px,-8px) scale(.94);opacity:.82}
.disc.d3{transform:translate(-20px,-15px) scale(.87);opacity:.6}
.disc.d1{position:absolute;inset:0;z-index:2}
.disc.d1.playing{animation:spin 7s linear infinite;will-change:transform}
body.is-background .disc.d1.playing{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.arm{position:absolute;top:2px;inset-inline-end:20px;width:6px;height:80px;border-radius:4px;background:linear-gradient(180deg,#d6d6d2,#8b8b87);transform-origin:50% 6px;transform:rotate(-32deg);transition:transform .35s ease;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.arm::before{content:"";position:absolute;top:-5px;left:-3px;width:14px;height:14px;border-radius:50%;background:linear-gradient(145deg,#efefeb,#93938e)}
.arm::after{content:"";position:absolute;bottom:-4px;left:-3px;width:12px;height:14px;border-radius:3px;background:#5a5a57}
.gramo.playing .arm{transform:rotate(10deg)}
.g-info{min-width:0}
.g-title{font-family:var(--font-serif);font-style:italic;font-size:20px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-artist{font-size:10px;color:var(--mu);letter-spacing:.06em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-progress{margin-top:9px}
.g-progress input[type=range]{width:100%;height:22px;margin:0;padding:0;background:transparent}
.g-times{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px;color:var(--mu);margin-top:-4px}
.g-controls{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-top:7px}
.g-controls .icon-btn{width:40px;height:40px;min-height:40px}
.g-controls .play-btn{width:48px;height:48px;min-height:48px;background:linear-gradient(145deg,var(--pk),var(--pk3));color:var(--onpk);border-color:transparent}
.g-controls .icon-btn.on{color:var(--pk3);border-color:var(--pk);background:rgba(var(--acc),.14)}
.g-controls svg{width:17px;height:17px}
.g-extra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:10px;color:var(--mu)}
.vol-wrap{display:flex;align-items:center;gap:5px;flex:1;min-width:110px}
.vol-wrap input[type=range]{flex:1;min-width:60px;height:18px}
.vol-wrap b{font-family:var(--font-mono);font-size:9px;min-width:28px;text-align:end}
.knob-wrap{position:relative;width:44px;height:44px;min-height:44px;flex:none;display:grid;place-items:center;border-radius:50%}
.knob{width:36px;height:36px;border-radius:50%;position:relative;pointer-events:none;border:1px solid var(--ln);background:conic-gradient(from -135deg,var(--pk) calc(var(--v,70)*2.7deg),var(--ringtrack) 0);box-shadow:0 1px 0 var(--gl) inset,0 3px 8px -6px var(--sh)}
.knob::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card-solid);box-shadow:0 1px 0 var(--gl) inset}
.knob::before{content:"";position:absolute;width:2px;height:10px;border-radius:2px;background:var(--pk3);top:3px;left:calc(50% - 1px);transform-origin:50% 15px;transform:rotate(calc(-135deg + var(--v,70)*2.7deg));z-index:2}
.knob-wrap input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:3}
.g-add{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.track-list{margin-top:10px;border-top:1px solid var(--ln2);padding-top:6px;display:flex;flex-direction:column;gap:2px;max-height:180px;overflow:auto;overscroll-behavior:contain}
.track-row{display:flex;align-items:center;gap:7px;min-height:42px;border-radius:9px;padding:4px 6px;text-align:start;width:100%;font-size:11.5px}
.track-row:hover{background:var(--gl2)}
.track-row.on{background:rgba(var(--acc),.1);border:1px solid var(--ln2)}
.track-row .tr-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-row .del{color:var(--danger);font-size:9.5px;padding:4px 6px;border-radius:6px;min-height:30px;flex:none}
.track-row .del.armed{background:rgba(157,61,58,.14)}
.gramo-note{font-size:9.5px;color:var(--mu);margin-top:6px;line-height:1.6}
@media(max-width:620px){.gramo{grid-template-columns:1fr}.g-arts{height:140px}.discs{width:118px;height:118px}.disc .label{width:38px;height:38px;font-size:12px}.arm{inset-inline-end:26%;height:64px}}
/* stopwatch */
.stopwatch{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.sw-time{font-family:var(--font-mono);font-size:clamp(28px,6vw,40px);letter-spacing:-1px;line-height:1.1}
.crown{width:20px;height:20px;border-radius:5px;border:2px solid var(--pk);background:linear-gradient(145deg,var(--gl),transparent);box-shadow:0 2px 0 var(--ln)}
/* ======= calendar ======= */
.season-card{overflow:hidden;padding:0;margin-bottom:12px}
.season-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.season-fx span{position:absolute;font-size:12px;opacity:.5;color:var(--pk2)}
.season-fx.snow span{color:#a9bcc9;font-size:11px}
.season-fx.rain span{width:1px;height:14px;border-radius:2px;background:linear-gradient(180deg,transparent,var(--pk2));font-size:0}
.season-fx.summer span{width:5px;height:5px;border-radius:50%;background:radial-gradient(circle,var(--pk2),transparent 70%);opacity:.85;font-size:0}
html[data-mode="dark"] .season-fx.snow span{color:#c9d8e3}
.season-fx span:nth-child(1){top:14%;inset-inline-start:8%}
.season-fx span:nth-child(2){top:48%;inset-inline-start:22%}
.season-fx span:nth-child(3){top:24%;inset-inline-start:42%}
.season-fx span:nth-child(4){top:62%;inset-inline-start:66%}
.season-fx span:nth-child(5){top:16%;inset-inline-start:84%}
.season-fx span:nth-child(6){top:74%;inset-inline-start:92%}
.cal-card{padding:clamp(10px,2.4vw,20px);min-width:0}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cal-title{font-family:var(--font-serif);font-size:20px;line-height:1.2;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-title small{display:block;font-family:var(--font-mono);font-size:9px;color:var(--mu);letter-spacing:.1em}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 0 5px;text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--mu);letter-spacing:.08em;min-width:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;grid-auto-rows:auto;min-width:0;touch-action:pan-y}
.day-btn{position:relative;min-width:0;min-height:0;aspect-ratio:1;overflow:hidden;border-radius:12px;border:1px solid var(--ln2);background:linear-gradient(155deg,var(--card-solid),var(--card2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;padding:2px;color:var(--tx);text-overflow:ellipsis}
.day-btn:active{transform:scale(.96)}
.day-btn.out{opacity:.26;pointer-events:none}
.day-btn.today{border-color:var(--pk);box-shadow:0 0 0 1px var(--pk) inset}
.day-btn.today b::after{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--pk);margin-inline-start:3px;vertical-align:middle}
.day-btn b{font-weight:600;font-family:var(--font-mono);font-size:11.5px;line-height:1.1}
.day-btn .cal-meta{display:flex;gap:2px;align-items:center;height:6px;margin-top:1px}
.day-btn .mdot{width:4px;height:4px;border-radius:50%;display:inline-block}
.day-btn .evdot{width:4px;height:4px;border-radius:1px;background:var(--pk3);display:inline-block}
.day-btn .gday{font-size:7px;color:var(--mu);opacity:.7;line-height:1}
.day-btn.pd1{background:linear-gradient(155deg,rgba(var(--pd),.14),var(--card2))}
.day-btn.pd2{background:linear-gradient(155deg,rgba(var(--pd),.24),var(--card2))}
.day-btn.pd3{background:linear-gradient(155deg,rgba(var(--pd),.36),var(--card2))}
.day-btn.pd4{background:linear-gradient(155deg,rgba(var(--pd),.5),var(--card2))}
.cal-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;font-size:10.5px;color:var(--mu)}
.cal-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin-top:12px}
.stat{padding:10px 12px;border:1px solid var(--ln2);border-radius:14px;background:var(--gl2)}
.stat b{display:block;font-family:var(--font-serif);font-size:20px;line-height:1.3}
.stat small{font-size:10px;color:var(--mu)}
.period-banner{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;background:linear-gradient(150deg,rgba(var(--pd),.16),var(--gl2));border:1px solid rgba(var(--pd),.28);margin-top:10px;flex-wrap:wrap}
.period-banner b{font-size:12.5px}
.period-banner small{font-size:10px;color:var(--mu)}
/* day dialog */
.day-sheet{display:flex;flex-direction:column;gap:12px}
.day-hero{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--ln2)}
.day-hero h3{font-family:var(--font-serif);font-size:22px;line-height:1.2}
.day-hero small{font-family:var(--font-mono);font-size:9px;color:var(--mu);letter-spacing:.06em}
.day-sec{border:1px solid var(--ln2);border-radius:14px;padding:10px 11px;background:var(--gl2)}
.day-sec>h4{font-size:11.5px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.day-sec .mini-list{font-size:11px;color:var(--mu);line-height:1.9}
.day-sec .mini-list li{display:flex;gap:5px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ln2);padding:3px 0;min-height:32px}
.day-sec .mini-list li:last-child{border-bottom:0}
.day-sec .mini-list .t{flex:1;overflow-wrap:anywhere}
.period-toggle{width:100%;justify-content:center;min-height:46px}
/* ======= settings ======= */
.theme-swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:44px;height:44px;min-height:44px;border-radius:50%;border:1px solid var(--ln);position:relative;box-shadow:0 1px 0 var(--gl) inset,0 6px 14px -10px var(--sh);padding:0}
.swatch i{position:absolute;inset:5px;border-radius:50%;display:block}
.swatch.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.swatch.on{outline:2px solid var(--pk);outline-offset:3px}
.theme-names{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.theme-names button{border:1px solid var(--ln);min-height:32px;background:var(--gl2)}
.theme-names button{font-size:10px;color:var(--mu);padding:3px 8px;border-radius:99px;min-height:30px}
.theme-names button.on{background:rgba(var(--acc),.14);color:var(--pk3)}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--ln2);min-height:48px}
.sw-row:last-child{border-bottom:0}
.sw-row .lab{font-size:12.5px}
.sw-row .lab small{display:block;font-size:10px;color:var(--mu);line-height:1.5}
.set-list{display:flex;flex-direction:column}
.set-card h3{font-size:15px;margin-bottom:2px}
.set-card .sub{font-size:10.5px;color:var(--mu);margin-bottom:8px}
.gender-row{display:flex;gap:6px}
.bk-actions{display:flex;gap:6px;flex-wrap:wrap}
.about-box{font-size:11.5px;color:var(--mu);line-height:2}
.about-box b{color:var(--tx)}
.perf-list{display:grid;gap:5px;margin-top:6px}
.perf-list span{font-size:10.5px;color:var(--mu);display:flex;gap:6px;align-items:flex-start}
.perf-list span::before{content:"✓";color:var(--ok);font-weight:700;flex:none}
.perf-warn{font-size:10.5px;border:1px dashed var(--ln);border-radius:10px;padding:7px 9px;margin-top:8px;color:var(--mu)}
/* ======= bottom nav / fab / toast ======= */
.tabbar{position:fixed;inset-inline:0;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;width:min(640px,calc(100% - 22px));margin:0 auto;display:flex;align-items:stretch;gap:2px;padding:5px;border-radius:24px;border:1px solid var(--ln);background:linear-gradient(155deg,var(--nav),var(--card2));box-shadow:0 1px 0 var(--gl) inset,0 18px 36px -22px rgba(20,16,10,.5)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:56px;border-radius:19px;color:var(--mu);font-size:10.5px;line-height:1.2;padding:4px 2px;position:relative;transition:transform .16s ease}
.tab svg{width:20px;height:20px;flex:none}
.tab small{font-family:var(--font-mono);font-size:7px;letter-spacing:.06em;opacity:.62;text-transform:uppercase}
.tab.active{background:linear-gradient(155deg,var(--card-solid),var(--card2));color:var(--tx);box-shadow:0 1px 0 var(--gl) inset,0 6px 14px -12px var(--sh);font-weight:600}
.tab.active svg{color:var(--pk3)}
.tab.active::after{content:"";position:absolute;top:6px;width:14px;height:2px;border-radius:2px;background:var(--pk);opacity:.85}
.fab{position:fixed;inset-inline-end:max(16px,calc((100vw - 1180px)/2 + 20px));bottom:calc(92px + env(safe-area-inset-bottom));z-index:59;width:54px;height:54px;min-height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,var(--card-solid),var(--card2));border:1px solid var(--ln);color:var(--tx);font-size:25px;box-shadow:0 1px 0 var(--gl) inset,0 14px 24px -16px var(--sh);transition:transform .16s ease}
.fab:active{transform:scale(.94)}
.fab svg{width:21px;height:21px}
@media(max-width:700px){.fab{bottom:calc(88px + env(safe-area-inset-bottom));width:50px;height:50px;min-height:50px;inset-inline-end:14px}.tabbar{bottom:calc(7px + env(safe-area-inset-bottom));width:calc(100% - 14px);border-radius:22px;padding:4px}.tab{min-height:54px;border-radius:17px;font-size:10px}.tab small{font-size:6.5px}}
#toastHost{position:fixed;inset-inline:0;bottom:calc(160px + env(safe-area-inset-bottom));z-index:210;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{max-width:min(440px,92vw);padding:10px 15px;border-radius:14px;border:1px solid var(--ln);background:linear-gradient(150deg,var(--card-solid),var(--card));color:var(--tx);box-shadow:0 1px 0 var(--gl) inset,0 16px 30px -18px var(--sh);font-size:12px;text-align:center;animation:toastIn .25s ease both}
.toast.out{animation:toastOut .22s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
/* modal */
.modal-root{position:fixed;inset:0;z-index:130;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(18,16,12,.42);animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}}
.modal{width:100%;max-width:540px;max-height:min(88dvh,780px);overflow:auto;overscroll-behavior:contain;border-radius:26px;border:1px solid var(--ln);background:linear-gradient(155deg,var(--card-solid),var(--card2));box-shadow:0 1px 0 var(--gl) inset,0 30px 60px -24px rgba(0,0,0,.45);padding:clamp(14px,3vw,20px);animation:modalIn .24s ease both;position:relative}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.985)}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.modal-head h3{font-size:17px;line-height:1.3}
.modal-head small{display:block;font-size:10px;color:var(--mu);font-family:var(--font-mono);letter-spacing:.06em;margin-top:1px}
.modal .close{width:40px;height:40px;min-height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ln2);color:var(--mu);flex:none}
.modal .close svg{width:17px;height:17px}
.modal-body{display:flex;flex-direction:column;gap:10px}
.modal-foot{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.form-note{font-size:10px;color:var(--mu);line-height:1.7}
.emoji-pick{display:flex;flex-wrap:wrap;gap:4px}

let goalView = null;
function ensureGoalView() {
  if (!goalView || goalView.cal !== S.cal) {
    if (S.cal === 'j') { const j = jalaliOf(todayISO()); goalView = { y: j.jy, m: j.jm, cal: 'j' }; }
    else { const d = new Date(); goalView = { y: d.getFullYear(), m: d.getMonth() + 1, cal: 'g' }; }
  }
  return goalView;
}
function viewYM() { const v = ensureGoalView(); return [v.y, v.m]; }
function shiftMonth(y, m, delta, cal) {
  let nm = m + delta, ny = y;
  const max = cal === 'j' ? 12 : 12;
  while (nm > max) { nm -= max; ny++; }
  while (nm < 1) { nm += max; ny--; }
  return [ny, nm];
}
function monthDates(y, m, cal) {
  const info = monthInfo(y, m, cal);
  return Array.from({ length: info.len }, (_, i) => cal === 'j' ? isoOfJalali(y, m, i + 1) : isoOfGregorian(y, m, i + 1));
}
function monthPct(y, m, cal = S.cal) {
  const dates = monthDates(y, m, cal); if (!dates.length) return 0;
  const total = (S.habits || []).length; if (!total) return 0;
  const today = todayISO();
  const elapsed = dates.filter(d => d <= today).length;
  const denomDays = elapsed || (dates.length < 20 ? 1 : dates.length);
  let done = 0;
  dates.forEach(d => { if (d <= today) done += doneCountFor(d); });
  if (cal === 'g') { const cur = new Date(); if (y > cur.getFullYear() || (y === cur.getFullYear() && m > cur.getMonth() + 1)) return 0; }
  else { const jt = jalaliOf(today); if (y > jt.jy || (y === jt.jy && m > jt.jm)) return 0; }
  return pct(done, total * Math.max(denomDays, 1));
}
function levelFor(p) {
  if (p >= 80) return { key: 'champion', label: t('champion'), emoji: '🏆', idx: 4 };
  if (p >= 50) return { key: 'gold', label: t('gold'), emoji: '🥇', idx: 3 };
  if (p >= 25) return { key: 'silver', label: t('silver'), emoji: '🥈', idx: 2 };
  if (p >= 10) return { key: 'bronze', label: t('bronze'), emoji: '🥉', idx: 1 };
  return { key: 'seed', label: t('seed'), emoji: '🌱', idx: 0 };
}
function medalFor(p) { const l = levelFor(p); return l.emoji + ' ' + l.label; }
function yearStats(y, cal = S.cal) {
  return Array.from({ length: 12 }, (_, i) => monthPct(y, i + 1, cal));
}
function updateHist() {
  S.hist = S.hist || {};
  let changed = false;
  for (let i = 1; i <= 14; i++) { const d = addISO(todayISO(), -i); const p = dayPct(d); if (!S.hist[d] || S.hist[d].p !== p) { S.hist[d] = { p, m: levelFor(p).key }; changed = true; } }
  if (changed) save();
}

function calendarDayNumber(iso) { return S.cal === 'g' ? dateOfISO(iso).getDate() : jalaliOf(iso).jd; }

function pngIcon(size) {
  try {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d');
    if (!x) return '';
    const r = size * .22;
    x.fillStyle = '#000'; x.beginPath();
    if (x.roundRect) x.roundRect(0, 0, size, size, r); else x.rect(0, 0, size, size);
    x.fill();
    const grad = x.createRadialGradient(size * .34, size * .22, size * .04, size * .5, size * .5, size * .66);
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(.62, '#f2f2f2'); grad.addColorStop(1, '#bfbfbf');
    x.save();
    x.translate(size * .5, size * .5); x.scale(size / 200, size / 200); x.translate(-100, -100);
    const p = new Path2D(LOGO_PATH);
    x.fillStyle = grad; x.fill(p);
    x.save(); x.translate(48, 156); x.rotate(-24 * Math.PI / 180); x.beginPath(); x.ellipse(0, 0, 17, 24, 0, 0, Math.PI * 2); x.fill(); x.restore();
    x.restore();
    return c.toDataURL('image/png');
  } catch (e) { return ''; }
}
